events {}

http {
    server {
        listen 80;
        root /usr/share/nginx/html;
        
        location / {
            try_files $uri /index.html;
        }
        
        location /users {
            proxy_pass http://backend:3000/users;
            proxy_set_header Host $host;
        }
        
        location /message {
            proxy_pass http://backend:3000/message;
            proxy_set_header Host $host;
        }
    }
}
