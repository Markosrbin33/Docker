<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>App Full Stack</title>
</head>
<body>
    <h1>🚀 Application Full Stack</h1>
    
    <div>
        <h2>Message</h2>
        <div id="message">Chargement...</div>
        <button onclick="getMessage()">Rafraîchir</button>
    </div>
    
    <div>
        <h2>Utilisateurs</h2>
        <div id="users">Chargement...</div>
        <button onclick="getUsers()">Rafraîchir</button>
    </div>
    
    <div>
        <h2>Ajouter un utilisateur</h2>
        <input id="name" placeholder="Nom">
        <input id="email" placeholder="Email">
        <button onclick="addUser()">Ajouter</button>
    </div>
    
    <div id="result" style="margin-top:20px; padding:10px; background:#f0f0f0;"></div>

    <script>
        function getMessage() {
            fetch('/message')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('message').innerText = data.message || 'Pas de message';
                })
                .catch(err => {
                    document.getElementById('message').innerText = 'Erreur';
                });
        }

        function getUsers() {
            fetch('/users')
                .then(res => res.json())
                .then(data => {
                    let html = '<ul>';
                    data.forEach(u => html += `<li>${u.name} - ${u.email}</li>`);
                    html += '</ul>';
                    document.getElementById('users').innerHTML = html;
                })
                .catch(err => {
                    document.getElementById('users').innerHTML = 'Erreur';
                });
        }

        function addUser() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            
            fetch('/users', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, email})
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('result').innerHTML = '✅ Ajouté: ' + JSON.stringify(data);
                getUsers();
            })
            .catch(err => {
                document.getElementById('result').innerHTML = '❌ Erreur: ' + err;
            });
        }

        // Chargement initial
        getMessage();
        getUsers();
    </script>
</body>
</html>
